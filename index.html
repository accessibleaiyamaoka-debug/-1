<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* =========================================================
   音再生(ブラウザ標準 Web Audio API。外部ライブラリ不使用)
   ========================================================= */
const NOTE_SEMITONE = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(letter, octave) {
  const n = NOTE_SEMITONE[letter] + (octave - 4) * 12;
  return 440 * Math.pow(2, n / 12);
}
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    _audioCtx = new AC();
  }
  if (_audioCtx.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}
function beep(freq, duration = 0.35, delay = 0, gainPeak = 0.28) {
  try {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainPeak, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  } catch (e) {}
}
function playNoteSound(letter, octave, duration = 0.4) {
  beep(noteFreq(letter, octave), duration);
}
function playChimeSound() {
  beep(noteFreq("C", 5), 0.16, 0);
  beep(noteFreq("E", 5), 0.16, 0.11);
  beep(noteFreq("G", 5), 0.16, 0.22);
  beep(noteFreq("C", 6), 0.28, 0.33);
}

/* =========================================================
   音楽理論ヘルパー
   ========================================================= */
const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
const SOLFEGE = { C: "ド", D: "レ", E: "ミ", F: "ファ", G: "ソ", A: "ラ", B: "シ" };
const SOLFEGE_ORDER = ["ド", "レ", "ミ", "ファ", "ソ", "ラ", "シ"];

// 基準:まんなかの「ド」(C4)。
// ト音記号 = 真ん中のド(C4)〜1オクターブ上のミ(E5)
// ヘ音記号 = 真ん中のド(C4)〜1オクターブ下のソ(G2・低音記号の一番下の線)
const CLEF_INFO = {
  treble: { offset: -2, min: -2, max: 7, label: "ト音記号", symbol: "\uD834\uDD1E" },
  bass: { offset: 10, min: 0, max: 10, label: "ヘ音記号", symbol: "\uD834\uDD22" },
};

function positionToNote(clef, pos) {
  const { offset } = CLEF_INFO[clef];
  const diff = pos - offset;
  const idx = ((diff % 7) + 7) % 7;
  const letter = LETTERS[idx];
  const octave = 4 + Math.floor(diff / 7);
  return { letter, octave, solfege: SOLFEGE[letter] };
}
function noteIndex(letter, octave) {
  return octave * 7 + LETTERS.indexOf(letter);
}
function indexToNote(i) {
  const octave = Math.floor(i / 7);
  const letter = LETTERS[((i % 7) + 7) % 7];
  return { letter, octave };
}
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randomNote(clefFilter, avoidPos) {
  const clef = clefFilter === "both" ? (Math.random() < 0.5 ? "treble" : "bass") : clefFilter;
  const { min, max } = CLEF_INFO[clef];
  let pos = randInt(min, max);
  if (avoidPos && avoidPos.clef === clef && max > min) {
    let tries = 0;
    while (pos === avoidPos.pos && tries < 8) {
      pos = randInt(min, max);
      tries++;
    }
  }
  const note = positionToNote(clef, pos);
  return { clef, pos, ...note };
}
// まんなかのド(そのクレフでの位置)から目標音符の位置まで、1つずつ数えていく道すじ(五線上の位置の配列)
function hintPositions(clef, targetPos) {
  const midC = CLEF_INFO[clef].offset;
  const path = [];
  if (targetPos === midC) {
    path.push(midC);
  } else {
    const step = targetPos > midC ? 1 : -1;
    for (let p = midC; ; p += step) {
      path.push(p);
      if (p === targetPos) break;
    }
  }
  return path;
}

const PRAISE = ["やったね！", "せいかい！", "さすが〜！", "ぴったり！", "かんぺき！", "その調子！"];
const GENTLE = ["おしい！もういっかい！", "だいじょうぶ、がんばれ！", "ちかいよ、もう一回！"];

/* =========================================================
   音部記号
   Google Fonts の音楽記号専用フォント「Noto Music」を読み込んで使用。
   端末ごとのフォント差異による位置ズレを防ぐため、
   実際に描画されたサイズを毎回測定して、狙った五線の位置へ
   プログラムで正確にそろえる(目分量の座標を使わない)。
   ========================================================= */
function ClefSymbol({ clef, x, yFor, color }) {
  const textRef = useRef(null);
  // 測定できるまでは画面外に隠しておく(大きさや位置がおかしいまま一瞬表示されるのを防ぐ)
  const [tf, setTf] = useState("translate(-9999 -9999)");
  const anchorLine = clef === "treble" ? 2 : 6; // ト音記号=ソの線 / ヘ音記号=ファの線
  const targetY = yFor(anchorLine);
  const refFontSize = 100; // 測定用の基準サイズ(実際の表示サイズは測定結果から逆算する)
  // 画面上での目標の高さ(px)。五線の間隔(spacing)を基準に決める
  const desiredHeight = clef === "treble" ? 78 : 54;
  // 記号の縦の広がりの中で、線に合わせたい位置の割合(上端からの比率)
  // ト音記号:前回「したすぎた」→ 合わせる基準点をもっと下寄り(値を大きく)にして押し上げる
  // ヘ音記号:前回「うえすぎた」→ 合わせる基準点をもっと上寄り(値を小さく)にして押し下げる
  const anchorFrac = clef === "treble" ? 0.56 : 0.3;

  useEffect(() => {
    let cancelled = false;
    const measure = () => {
      if (cancelled || !textRef.current) return;
      try {
        const b = textRef.current.getBBox();
        if (!b || b.width === 0 || b.height === 0) return;
        const scale = desiredHeight / b.height;
        const anchorXInBox = b.x + b.width / 2;
        const anchorYInBox = b.y + b.height * anchorFrac;
        const dx = x - anchorXInBox * scale;
        const dy = targetY - anchorYInBox * scale;
        setTf(`translate(${dx} ${dy}) scale(${scale})`);
      } catch (e) {}
    };
    measure();
    if (typeof document !== "undefined" && document.fonts && document.fonts.ready) {
      document.fonts.ready.then(measure);
    }
    const t1 = setTimeout(measure, 200);
    const t2 = setTimeout(measure, 600);
    return () => {
      cancelled = true;
      clearTimeout(t1);
      clearTimeout(t2);
    };
  }, [clef, x, targetY, desiredHeight, anchorFrac]);

  return (
    <text
      ref={textRef}
      x={0}
      y={0}
      fontSize={refFontSize}
      fill={color}
      transform={tf}
      style={{ fontFamily: "'Noto Music', 'Segoe UI Symbol', sans-serif" }}
    >
      {CLEF_INFO[clef].symbol}
    </text>
  );
}

// ある五線位置に加線が必要か調べ、必要な加線の位置(数値配列)を返す
function ledgerPositionsFor(pos) {
  const out = [];
  if (pos >= 10) {
    for (let l = 10; l <= pos; l += 2) out.push(l);
  } else if (pos <= -2) {
    for (let l = -2; l >= pos; l -= 2) out.push(l);
  }
  return out;
}

/* =========================================================
   五線譜 SVG コンポーネント
   ========================================================= */
function StaffView({ clef, pos, mood }) {
  const baseY = 172;
  const spacing = 9;
  const yFor = (p) => baseY - p * spacing;
  const lineYs = [0, 2, 4, 6, 8].map(yFor);
  const noteX = 195;
  const noteY = yFor(pos);

  const ledgers = ledgerPositionsFor(pos);
  const stemUp = pos < 4;
  const noteColor = mood === "correct" ? "#5FB88A" : mood === "wrong" ? "#E8688A" : "#3B3050";

  return (
    <svg viewBox="0 0 300 260" className="w-full max-w-xs mx-auto" style={{ display: "block" }}>
      {lineYs.map((y, i) => (
        <line key={i} x1={55} y1={y} x2={265} y2={y} stroke="#B7A8D6" strokeWidth={2.5} strokeLinecap="round" />
      ))}
      <ClefSymbol clef={clef} x={90} yFor={yFor} color="#6B4E9B" />
      {ledgers.map((l) => (
        <line key={l} x1={noteX - 17} y1={yFor(l)} x2={noteX + 17} y2={yFor(l)} stroke="#B7A8D6" strokeWidth={2.5} strokeLinecap="round" />
      ))}
      {stemUp ? (
        <line x1={noteX + 8.7} y1={noteY - 1} x2={noteX + 8.7} y2={noteY - 40} stroke={noteColor} strokeWidth={2.4} strokeLinecap="round" />
      ) : (
        <line x1={noteX - 8.7} y1={noteY + 1} x2={noteX - 8.7} y2={noteY + 40} stroke={noteColor} strokeWidth={2.4} strokeLinecap="round" />
      )}
      <ellipse cx={noteX} cy={noteY} rx={10.5} ry={7.8} fill={noteColor} transform={`rotate(-18 ${noteX} ${noteY})`} />
    </svg>
  );
}

/* =========================================================
   練習モード:五線譜のうえで まんなかのドから順番にたどるヒント
   ・出題された音符(黒)は右がわの定位置にずっと表示したまま
   ・まんなかのド(赤)を起点に、1つずつ横に並べながら
     正しい高さの位置へ音符(紫)を配置していく(重なり防止)
   ・最後の1個は黒い音符とぴったり同じ位置に重なって「これだ!」となる
   ========================================================= */
function HintStaffView({ clef, targetPos, revealCount }) {
  const baseY = 172;
  const spacing = 9;
  const yFor = (p) => baseY - p * spacing;
  const lineYs = [0, 2, 4, 6, 8].map(yFor);
  const midC = CLEF_INFO[clef].offset;

  const path = useMemo(() => hintPositions(clef, targetPos), [clef, targetPos]);
  const shown = path.slice(0, Math.max(0, revealCount));

  const rightX = 250; // 黒い音符(=たどり着く先)の固定x座標
  const leftBound = 122; // 音部記号とぶつからない左限界
  const n = path.length;
  const stepX = n > 1 ? Math.min(26, Math.max(12, (rightX - leftBound) / (n - 1))) : 0;
  const noteR = Math.max(6, Math.min(10.5, stepX / 2 - 1.5));
  const xFor = (i) => rightX - (n - 1 - i) * stepX;

  const targetY = yFor(targetPos);
  const targetLedgers = ledgerPositionsFor(targetPos);

  return (
    <svg viewBox="0 0 300 260" className="w-full max-w-xs mx-auto" style={{ display: "block" }}>
      {lineYs.map((y, i) => (
        <line key={i} x1={55} y1={y} x2={265} y2={y} stroke="#B7A8D6" strokeWidth={2.5} strokeLinecap="round" />
      ))}
      <ClefSymbol clef={clef} x={90} yFor={yFor} color="#6B4E9B" />

      {/* 出題された音符(黒)専用の加線 */}
      {targetLedgers.map((l) => (
        <line key={"t" + l} x1={rightX - 16} y1={yFor(l)} x2={rightX + 16} y2={yFor(l)} stroke="#B7A8D6" strokeWidth={2.5} strokeLinecap="round" />
      ))}
      {/* 出題された音符(黒)。ヒント中もずっと表示 */}
      <ellipse cx={rightX} cy={targetY} rx={10.5} ry={7.8} fill="#3B3050" transform={`rotate(-18 ${rightX} ${targetY})`} />

      {shown.map((p, i) => {
        const isMid = p === midC;
        const isActive = i === shown.length - 1;
        const y = yFor(p);
        const x = xFor(i);
        const color = isMid ? "#E8556F" : "#8B6FC7";
        const r = isActive ? noteR + 1.5 : noteR;
        const myLedgers = ledgerPositionsFor(p);
        return (
          <g key={p}>
            {myLedgers.map((l) => (
              <line key={l} x1={x - noteR - 5} y1={yFor(l)} x2={x + noteR + 5} y2={yFor(l)} stroke="#B7A8D6" strokeWidth={2} strokeLinecap="round" />
            ))}
            <ellipse cx={x} cy={y} rx={r} ry={r * 0.75} fill={color} transform={`rotate(-18 ${x} ${y})`} style={{ transition: "all 0.25s ease" }} />
            {isMid && (
              <text x={x} y={y - 18} textAnchor="middle" fontSize={9.5} fontWeight="800" fill="#E8556F">
                まんなかのド
              </text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* =========================================================
   小さな装飾(星・音符が浮かぶ背景)
   ========================================================= */
const DECOR = [
  { e: "⭐️", top: "6%", left: "6%", delay: "0s", size: 22 },
  { e: "🎵", top: "12%", left: "88%", delay: "1.1s", size: 26 },
  { e: "✨", top: "38%", left: "3%", delay: "2s", size: 18 },
  { e: "🎶", top: "68%", left: "92%", delay: "0.5s", size: 24 },
  { e: "⭐️", top: "86%", left: "10%", delay: "1.6s", size: 16 },
  { e: "✨", top: "50%", left: "95%", delay: "2.4s", size: 16 },
  { e: "🎵", top: "80%", left: "80%", delay: "0.9s", size: 18 },
];

function BackgroundDecor() {
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
      {DECOR.map((d, i) => (
        <span
          key={i}
          style={{
            position: "absolute",
            top: d.top,
            left: d.left,
            fontSize: d.size,
            animation: `floaty 5.5s ease-in-out ${d.delay} infinite`,
            opacity: 0.75,
          }}
        >
          {d.e}
        </span>
      ))}
    </div>
  );
}

/* =========================================================
   メインアプリ
   ========================================================= */
function App() {
  const [screen, setScreen] = useState("home"); // home | game
  const [mode, setMode] = useState("instant"); // instant | practice
  const [clefFilter, setClefFilter] = useState("both"); // treble | bass | both

  const [note, setNote] = useState(null);
  const [feedback, setFeedback] = useState(null); // correct | wrong | null
  const [locked, setLocked] = useState(false);
  const [mascotMsg, setMascotMsg] = useState("この音符、なにかな？");
  const [burst, setBurst] = useState(false);

  // 即答モード成績
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [cleared, setCleared] = useState(false);
  const [clearTime, setClearTime] = useState(0);
  const streakStartRef = useRef(null);
  const GOAL_STREAK = 10;
  const INSTANT_TIME_LIMIT = 4; // 即答モード:1問あたりの制限時間(秒)
  const PRACTICE_TIME_LIMIT = 5; // 練習モード:ヒントが出るまでの時間(秒)

  // 練習モード
  const [timeLeft, setTimeLeft] = useState(5);
  const [hintActive, setHintActive] = useState(false);
  const [hintSteps, setHintSteps] = useState([]);
  const [hintIndex, setHintIndex] = useState(-1);
  const [practiceStars, setPracticeStars] = useState(0);

  const timerRef = useRef(null);
  const hintTimeoutsRef = useRef([]);

  const clearAllTimers = useCallback(() => {
    clearInterval(timerRef.current);
    hintTimeoutsRef.current.forEach(clearTimeout);
    hintTimeoutsRef.current = [];
  }, []);

  useEffect(() => () => clearAllTimers(), [clearAllTimers]);

  /* ---------- ゲーム進行 ---------- */
  const nextNote = useCallback(() => {
    clearAllTimers();
    setHintActive(false);
    setHintSteps([]);
    setHintIndex(-1);
    setFeedback(null);
    setLocked(false);
    setMascotMsg("この音符、なにかな？");
    setNote((prev) => randomNote(clefFilter, prev));
  }, [clefFilter, clearAllTimers]);

  const startGame = (selectedMode) => {
    getAudioCtx();
    setMode(selectedMode);
    setScore(0);
    setStreak(0);
    setBestStreak(0);
    setPracticeStars(0);
    setCleared(false);
    setClearTime(0);
    streakStartRef.current = null;
    setScreen("game");
    clearAllTimers();
    setHintActive(false);
    setFeedback(null);
    setLocked(false);
    setMascotMsg("この音符、なにかな？");
    setNote(randomNote(clefFilter, null));
  };

  const backHome = () => {
    clearAllTimers();
    setCleared(false);
    setScreen("home");
  };

  const triggerHint = useCallback(() => {
    if (!note) return;
    clearAllTimers();
    setLocked(true);
    setHintActive(true);
    const positions = hintPositions(note.clef, note.pos);
    const steps = positions.map((p) => ({ pos: p, ...positionToNote(note.clef, p) }));
    setHintSteps(steps);
    setHintIndex(-1);
    setMascotMsg("いっしょに かぞえよう！");
    steps.forEach((s, i) => {
      const t = setTimeout(() => {
        setHintIndex(i);
        playNoteSound(s.letter, s.octave, 0.3);
        if (i === steps.length - 1) {
          setTimeout(() => {
            setMascotMsg(`こたえは「${note.solfege}」だよ！`);
          }, 550);
        }
      }, i * 620);
      hintTimeoutsRef.current.push(t);
    });
  }, [note, clearAllTimers]);

  // 練習モードのタイマー(旧)は下の共通タイマーに統合済み

  // クリア後の「もう一度あそぶ」
  const retryStreak = () => {
    setCleared(false);
    setStreak(0);
    streakStartRef.current = null;
    nextNote();
  };

  // 時間切れの処理(練習モード=ヒント表示 / 即答モード=ミス扱い)
  const handleTimeout = useCallback(() => {
    if (mode === "practice") {
      triggerHint();
      return;
    }
    setLocked(true);
    setStreak(0);
    setFeedback("wrong");
    setMascotMsg("じかんぎれ〜！もういっかい！");
    setTimeout(() => nextNote(), 1100);
  }, [mode, triggerHint, nextNote]);

  // 出題ごとのタイマー(即答モード・練習モード共通)
  useEffect(() => {
    if (screen !== "game" || !note || locked || hintActive || cleared) return;
    const limit = mode === "practice" ? PRACTICE_TIME_LIMIT : INSTANT_TIME_LIMIT;
    setTimeLeft(limit);
    const start = Date.now();
    timerRef.current = setInterval(() => {
      const remain = Math.max(0, limit - (Date.now() - start) / 1000);
      setTimeLeft(remain);
      if (remain <= 0) {
        clearInterval(timerRef.current);
        handleTimeout();
      }
    }, 100);
    return () => clearInterval(timerRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [note, mode, screen, cleared]);

  const handleAnswer = (sol) => {
    if (!note || locked || hintActive || cleared) return;
    const correct = sol === note.solfege;

    if (mode === "instant") {
      setLocked(true);
      clearAllTimers();
      if (correct) {
        setScore((s) => s + 1);
        if (streak === 0) streakStartRef.current = Date.now();
        const nextStreak = streak + 1;
        setStreak(nextStreak);
        setBestStreak((b) => Math.max(b, nextStreak));
        setFeedback("correct");
        setBurst(true);

        if (nextStreak >= GOAL_STREAK) {
          const elapsed = (Date.now() - (streakStartRef.current || Date.now())) / 1000;
          setMascotMsg("やったー！クリアだよ！！");
          playChimeSound();
          setTimeout(() => {
            setBurst(false);
            setClearTime(elapsed);
            setCleared(true);
          }, 700);
        } else {
          setMascotMsg(PRAISE[randInt(0, PRAISE.length - 1)]);
          playChimeSound();
          setTimeout(() => {
            setBurst(false);
            nextNote();
          }, 700);
        }
      } else {
        setStreak(0);
        setFeedback("wrong");
        setMascotMsg(`おしい！せいかいは「${note.solfege}」だったよ`);
        playNoteSound(note.letter, note.octave, 0.45);
        setTimeout(() => nextNote(), 1300);
      }
    } else {
      // practice
      if (correct) {
        setLocked(true);
        clearAllTimers();
        setPracticeStars((s) => s + 1);
        setFeedback("correct");
        setMascotMsg(PRAISE[randInt(0, PRAISE.length - 1)]);
        playChimeSound();
        setBurst(true);
        setTimeout(() => {
          setBurst(false);
          nextNote();
        }, 850);
      } else {
        setFeedback("wrong");
        setMascotMsg(GENTLE[randInt(0, GENTLE.length - 1)]);
        setTimeout(() => setFeedback(null), 400);
      }
    }
  };

  const listenCurrent = () => {
    if (!note) return;
    playNoteSound(note.letter, note.octave, 0.45);
  };

  const isHintDone = hintActive && hintIndex === hintSteps.length - 1;
  const currentTimeLimit = mode === "practice" ? PRACTICE_TIME_LIMIT : INSTANT_TIME_LIMIT;
  const timerPct = Math.max(0, Math.min(100, (timeLeft / currentTimeLimit) * 100));
  const timerColor = timeLeft > currentTimeLimit * 0.5 ? "#5FB88A" : timeLeft > currentTimeLimit * 0.2 ? "#F0B84C" : "#E8688A";

  const fontStack = "'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif";

  /* ============================= HOME ============================= */
  if (screen === "home") {
    return (
      <div
        className="min-h-screen w-full relative flex items-center justify-center p-4"
        style={{
          fontFamily: fontStack,
          background: "linear-gradient(160deg, #EAE0FB 0%, #D8ECFA 45%, #FDE4EF 100%)",
        }}
      >
        <GlobalStyle />
        <BackgroundDecor />
        <div className="relative z-10 w-full max-w-md">
          <div
            className="rounded-3xl p-6 shadow-xl"
            style={{ background: "rgba(255,255,255,0.85)", border: "3px solid #FFFFFF", boxShadow: "0 12px 30px rgba(107,78,155,0.18)" }}
          >
            <div className="text-center mb-4">
              <div style={{ fontSize: 44, lineHeight: 1 }}>🐰🎼</div>
              <h1 className="mt-2" style={{ fontSize: 26, fontWeight: 800, color: "#6B4E9B", letterSpacing: 1 }}>
                きらきら♪おんぷクエスト
              </h1>
              <p className="mt-1" style={{ fontSize: 13, color: "#8B7BAF", fontWeight: 700 }}>
                うさぎのメロと あそぼう！3年生の 譜読みたんけん
              </p>
            </div>

            {/* mascot speech */}
            <div className="flex items-center gap-2 mb-5 justify-center">
              <div
                className="rounded-2xl px-4 py-2 text-center"
                style={{ background: "#FFF3D6", border: "2px solid #FFE49C", fontSize: 13, color: "#7A5C1E", fontWeight: 700 }}
              >
                モードと 音記号を えらんでね！
              </div>
            </div>

            {/* clef selector */}
            <div className="mb-5">
              <p className="mb-2 text-center" style={{ fontSize: 12, color: "#6B4E9B", fontWeight: 800 }}>
                れんしゅうする 音記号
              </p>
              <div className="flex gap-2 justify-center flex-wrap">
                {[
                  { key: "treble", label: "ト音記号 𝄞" },
                  { key: "bass", label: "ヘ音記号 𝄢" },
                  { key: "both", label: "りょうほう" },
                ].map((c) => (
                  <button
                    key={c.key}
                    onClick={() => setClefFilter(c.key)}
                    className="rounded-full px-4 py-2 transition"
                    style={{
                      fontSize: 13,
                      fontWeight: 800,
                      fontFamily: fontStack,
                      background: clefFilter === c.key ? "#6B4E9B" : "#F1E9FB",
                      color: clefFilter === c.key ? "#FFFFFF" : "#6B4E9B",
                      border: "2px solid #6B4E9B",
                    }}
                  >
                    {c.label}
                  </button>
                ))}
              </div>
            </div>

            {/* mode cards */}
            <div className="flex flex-col gap-3">
              <button
                onClick={() => startGame("instant")}
                className="rounded-2xl p-4 text-left transition active:scale-95"
                style={{
                  background: "linear-gradient(135deg, #FFC1D9, #FFE0EC)",
                  border: "3px solid #FFFFFF",
                  boxShadow: "0 6px 16px rgba(255,131,175,0.35)",
                }}
              >
                <div className="flex items-center gap-3">
                  <div style={{ fontSize: 30 }}>⚡️</div>
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 17, color: "#8B2D53" }}>即答チャレンジ</div>
                    <div style={{ fontSize: 12, color: "#A5416B", fontWeight: 700 }}>直感でパッとタップ！スピード勝負</div>
                  </div>
                </div>
              </button>

              <button
                onClick={() => startGame("practice")}
                className="rounded-2xl p-4 text-left transition active:scale-95"
                style={{
                  background: "linear-gradient(135deg, #BFEAF0, #E1F6F9)",
                  border: "3px solid #FFFFFF",
                  boxShadow: "0 6px 16px rgba(95,184,202,0.35)",
                }}
              >
                <div className="flex items-center gap-3">
                  <div style={{ fontSize: 30 }}>⏳</div>
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 17, color: "#1F6B78" }}>練習レッスン</div>
                    <div style={{ fontSize: 12, color: "#2C8595", fontWeight: 700 }}>5びょうで こたえよう。まよったら ヒント！</div>
                  </div>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ============================= GAME ============================= */
  return (
    <div
      className="min-h-screen w-full relative flex items-start justify-center p-3"
      style={{
        fontFamily: fontStack,
        background: "linear-gradient(160deg, #EAE0FB 0%, #D8ECFA 45%, #FDE4EF 100%)",
      }}
    >
      <GlobalStyle />
      <BackgroundDecor />
      <div className="relative z-10 w-full max-w-md">
        {/* header */}
        <div className="flex items-center justify-between mb-3 mt-1">
          <button
            onClick={backHome}
            className="rounded-full p-2 flex items-center justify-center"
            style={{ background: "rgba(255,255,255,0.85)", border: "2px solid #FFFFFF" }}
            aria-label="ホームへもどる"
          >
            <span style={{color:"#6B4E9B",fontSize:16,fontWeight:800}}>←</span>
          </button>

          <div
            className="rounded-full px-3 py-1 flex items-center gap-1"
            style={{ background: "rgba(255,255,255,0.85)", fontSize: 12, fontWeight: 800, color: "#6B4E9B", border: "2px solid #FFFFFF" }}
          >
            {mode === "instant" ? "⚡️即答チャレンジ" : "⏳練習レッスン"} ・ {clefFilter === "both" ? "りょうほう" : CLEF_INFO[clefFilter].label}
          </div>

          {mode === "instant" ? (
            <div
              className="rounded-full px-3 py-1 flex items-center gap-1"
              style={{ background: "rgba(255,255,255,0.85)", border: "2px solid #FFFFFF" }}
            >
              <span style={{fontSize:13}}>🔥</span>
              <span style={{ fontSize: 12, fontWeight: 800, color: "#E8688A" }}>{streak}</span>
            </div>
          ) : (
            <div
              className="rounded-full px-3 py-1 flex items-center gap-1"
              style={{ background: "rgba(255,255,255,0.85)", border: "2px solid #FFFFFF" }}
            >
              <span style={{fontSize:13}}>⭐</span>
              <span style={{ fontSize: 12, fontWeight: 800, color: "#B8842A" }}>{practiceStars}</span>
            </div>
          )}
        </div>

        {mode === "instant" && !cleared && (
          <div className="flex flex-col items-center gap-1.5 mb-2">
            <div className="flex items-center gap-4" style={{ fontSize: 12, fontWeight: 800, color: "#6B4E9B" }}>
              <span className="flex items-center gap-1">
                <span style={{fontSize:13}}>🏆</span> スコア {score}
              </span>
              <span>さいこう連続 {bestStreak}</span>
            </div>
            <div className="flex items-center gap-1">
              <span style={{ fontSize: 11, fontWeight: 800, color: "#B8842A" }}>ゴールまで</span>
              <div className="flex gap-0.5">
                {Array.from({ length: GOAL_STREAK }).map((_, i) => (
                  <span
                    key={i}
                    style={{
                      width: 8,
                      height: 8,
                      borderRadius: 9999,
                      background: i < streak ? "#F0B84C" : "#EAE0FB",
                      display: "inline-block",
                      transition: "background 0.2s",
                    }}
                  />
                ))}
              </div>
              <span style={{ fontSize: 11, fontWeight: 800, color: "#B8842A" }}>{streak}/{GOAL_STREAK}</span>
            </div>
          </div>
        )}

        {/* staff card */}
        <div
          className="rounded-3xl p-4 mb-3 relative"
          style={{
            background: "rgba(255,255,255,0.9)",
            border: "3px solid #FFFFFF",
            boxShadow: "0 12px 30px rgba(107,78,155,0.18)",
          }}
        >
          {burst && <BurstFX />}

          {cleared ? (
            <div className="flex flex-col items-center justify-center text-center py-8 px-2">
              <div style={{ fontSize: 54, animation: "bouncy 0.9s ease infinite" }}>🏆</div>
              <div style={{ fontSize: 24, fontWeight: 800, color: "#B8842A", marginTop: 8 }}>クリア！！</div>
              <div style={{ fontSize: 14, fontWeight: 800, color: "#6B4E9B", marginTop: 10 }}>
                {GOAL_STREAK}問れんぞく せいかい！
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#8B7BAF", marginTop: 4 }}>
                タイム: {clearTime.toFixed(1)}びょう
              </div>
              <div className="flex gap-3 mt-6">
                <button
                  onClick={retryStreak}
                  className="rounded-full px-5 py-2.5 transition active:scale-95"
                  style={{ background: "#6B4E9B", color: "#FFFFFF", fontWeight: 800, fontSize: 14 }}
                >
                  もう一度あそぶ
                </button>
                <button
                  onClick={backHome}
                  className="rounded-full px-5 py-2.5 transition active:scale-95"
                  style={{ background: "#F1E9FB", color: "#6B4E9B", fontWeight: 800, fontSize: 14, border: "2px solid #D8C7F2" }}
                >
                  ホームへ
                </button>
              </div>
            </div>
          ) : (
            <>
              {note && !hintActive && <StaffView clef={note.clef} pos={note.pos} mood={feedback} />}
              {note && hintActive && <HintStaffView clef={note.clef} targetPos={note.pos} revealCount={hintIndex + 1} />}

              {!hintActive && (
                <div className="flex items-center justify-center gap-2 mt-1">
                  <button
                    onClick={listenCurrent}
                    className="rounded-full px-3 py-1 flex items-center gap-1 transition active:scale-95"
                    style={{ background: "#F1E9FB", border: "2px solid #D8C7F2" }}
                  >
                    <span style={{fontSize:13}}>🔊</span>
                    <span style={{ fontSize: 11, fontWeight: 800, color: "#6B4E9B" }}>音を聴く</span>
                  </button>
                  {mode === "practice" && (
                    <button
                      onClick={triggerHint}
                      className="rounded-full px-3 py-1 flex items-center gap-1 transition active:scale-95"
                      style={{ background: "#FFF3D6", border: "2px solid #FFE49C" }}
                    >
                      <span style={{fontSize:13}}>💡</span>
                      <span style={{ fontSize: 11, fontWeight: 800, color: "#B8842A" }}>ヒント</span>
                    </button>
                  )}
                </div>
              )}
            </>
          )}
        </div>

        {/* 出題タイマー(即答・練習 共通) */}
        {!hintActive && !cleared && (
          <div className="mb-3 px-1">
            <div className="w-full rounded-full overflow-hidden" style={{ height: 10, background: "#F1E9FB", border: "2px solid #FFFFFF" }}>
              <div
                style={{
                  height: "100%",
                  width: `${timerPct}%`,
                  background: timerColor,
                  transition: "width 0.1s linear, background 0.3s",
                  borderRadius: 9999,
                }}
              />
            </div>
          </div>
        )}

        {/* mascot + speech bubble */}
        {!cleared && (
          <div className="flex items-center gap-2 mb-3 justify-center">
            <div
              style={{
                fontSize: 34,
                animation: feedback === "correct" ? "bouncy 0.6s ease" : feedback === "wrong" ? "shaky 0.4s ease" : "none",
              }}
            >
              🐰
            </div>
            <div
              className="rounded-2xl px-4 py-2"
              style={{
                background: feedback === "correct" ? "#E7F7EE" : feedback === "wrong" ? "#FDEAEF" : "#FFF3D6",
                border: `2px solid ${feedback === "correct" ? "#B7E4CB" : feedback === "wrong" ? "#F5C2D2" : "#FFE49C"}`,
                fontSize: 13,
                fontWeight: 800,
                color: feedback === "correct" ? "#2C7A50" : feedback === "wrong" ? "#B23A5C" : "#7A5C1E",
                maxWidth: 260,
                textAlign: "center",
              }}
            >
              {mascotMsg}
            </div>
          </div>
        )}

        {/* hint sequence */}
        {hintActive && (
          <div
            className="rounded-2xl p-3 mb-3"
            style={{ background: "rgba(255,255,255,0.9)", border: "3px solid #FFE49C" }}
          >
            <p className="text-center mb-2" style={{ fontSize: 11, fontWeight: 800, color: "#B8842A" }}>
              まんなかの「ド」から じゅんばんに かぞえよう
            </p>
            <div className="flex items-center justify-center gap-1.5 flex-wrap">
              {hintSteps.map((s, i) => (
                <div
                  key={i}
                  className="rounded-xl flex items-center justify-center transition"
                  style={{
                    width: 40,
                    height: 40,
                    fontSize: 15,
                    fontWeight: 800,
                    background: i <= hintIndex ? "#6B4E9B" : "#F1E9FB",
                    color: i <= hintIndex ? "#FFFFFF" : "#B7A8D6",
                    transform: i === hintIndex ? "scale(1.15)" : "scale(1)",
                    transition: "all 0.25s ease",
                  }}
                >
                  {s.solfege}
                </div>
              ))}
            </div>
            {isHintDone && (
              <div className="flex justify-center mt-3">
                <button
                  onClick={nextNote}
                  className="rounded-full px-6 py-2 transition active:scale-95"
                  style={{ background: "#6B4E9B", color: "#FFFFFF", fontWeight: 800, fontSize: 14 }}
                >
                  つぎへ ▶
                </button>
              </div>
            )}
          </div>
        )}

        {/* answer buttons */}
        {!hintActive && !cleared && (
          <div className="flex flex-wrap gap-2 justify-center pb-6">
            {SOLFEGE_ORDER.map((sol) => {
              const isCorrectBtn = feedback && note && sol === note.solfege;
              return (
                <button
                  key={sol}
                  onClick={() => handleAnswer(sol)}
                  disabled={locked}
                  className="rounded-2xl transition active:scale-90"
                  style={{
                    width: 78,
                    height: 62,
                    fontSize: 20,
                    fontWeight: 800,
                    fontFamily: fontStack,
                    color: "#FFFFFF",
                    background: isCorrectBtn
                      ? "#5FB88A"
                      : feedback === "wrong" && !isCorrectBtn
                      ? "#D8C7F2"
                      : "linear-gradient(135deg, #A78BDB, #8B6FC7)",
                    opacity: locked && !isCorrectBtn ? 0.6 : 1,
                    border: "3px solid #FFFFFF",
                    boxShadow: "0 5px 12px rgba(107,78,155,0.3)",
                  }}
                >
                  {sol}
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* =========================================================
   正解時のきらきら演出
   ========================================================= */
function BurstFX() {
  const items = useMemo(
    () =>
      Array.from({ length: 10 }).map((_, i) => ({
        left: 10 + Math.random() * 80,
        emoji: ["✨", "⭐️", "🎉", "💫"][i % 4],
        delay: Math.random() * 0.15,
        size: 14 + Math.random() * 14,
      })),
    []
  );
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none rounded-3xl" aria-hidden="true">
      {items.map((it, i) => (
        <span
          key={i}
          style={{
            position: "absolute",
            left: `${it.left}%`,
            bottom: "40%",
            fontSize: it.size,
            animation: `popUp 0.85s ease-out ${it.delay}s forwards`,
          }}
        >
          {it.emoji}
        </span>
      ))}
    </div>
  );
}

/* =========================================================
   グローバルスタイル(フォント・キーフレーム)
   ========================================================= */
function GlobalStyle() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Music&display=swap');

      @keyframes floaty {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(8deg); }
      }
      @keyframes bouncy {
        0% { transform: translateY(0); }
        30% { transform: translateY(-14px) rotate(-8deg); }
        55% { transform: translateY(0) rotate(6deg); }
        75% { transform: translateY(-6px); }
        100% { transform: translateY(0); }
      }
      @keyframes shaky {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        50% { transform: translateX(6px); }
        75% { transform: translateX(-4px); }
      }
      @keyframes popUp {
        0% { opacity: 0; transform: translateY(0) scale(0.5); }
        20% { opacity: 1; transform: translateY(-20px) scale(1.1); }
        100% { opacity: 0; transform: translateY(-90px) scale(0.9); }
      }
    `}</style>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
