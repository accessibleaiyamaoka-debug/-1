<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>きらきら♪おんぷクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#EAE0FB; }
  * { -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100%; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(8deg); }
  }
  @keyframes bouncy {
    0% { transform: translateY(0); }
    30% { transform: translateY(-14px) rotate(-8deg); }
    55% { transform: translateY(0) rotate(6deg); }
    75% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
  }
  @keyframes shaky {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }
  @keyframes popUp {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 1; transform: translateY(-20px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-90px) scale(0.9); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* =========================================================
   音楽理論ヘルパー
   ========================================================= */
const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
const SOLFEGE = { C: "ド", D: "レ", E: "ミ", F: "ファ", G: "ソ", A: "ラ", B: "シ" };
const SOLFEGE_ORDER = ["ド", "レ", "ミ", "ファ", "ソ", "ラ", "シ"];

const CLEF_INFO = {
  treble: { offset: -2, min: -9, max: 12, label: "ト音記号", symbol: "\uD834\uDD1E" },
  bass: { offset: 10, min: -4, max: 17, label: "ヘ音記号", symbol: "\uD834\uDD22" },
};

function positionToNote(clef, pos) {
  const { offset } = CLEF_INFO[clef];
  const diff = pos - offset;
  const idx = ((diff % 7) + 7) % 7;
  const letter = LETTERS[idx];
  const octave = 4 + Math.floor(diff / 7);
  return { letter, octave, solfege: SOLFEGE[letter] };
}
function noteIndex(letter, octave) {
  return octave * 7 + LETTERS.indexOf(letter);
}
function indexToNote(i) {
  const octave = Math.floor(i / 7);
  const letter = LETTERS[((i % 7) + 7) % 7];
  return { letter, octave };
}
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randomNote(clefFilter, avoidPos) {
  const clef = clefFilter === "both" ? (Math.random() < 0.5 ? "treble" : "bass") : clefFilter;
  const { min, max } = CLEF_INFO[clef];
  let pos = randInt(min, max);
  if (avoidPos && avoidPos.clef === clef && max > min) {
    let tries = 0;
    while (pos === avoidPos.pos && tries < 8) {
      pos = randInt(min, max);
      tries++;
    }
  }
  const note = positionToNote(clef, pos);
  return { clef, pos, ...note };
}
function hintPath(target) {
  const refIndex = noteIndex("C", 4);
  const tgtIndex = noteIndex(target.letter, target.octave);
  const path = [];
  if (tgtIndex === refIndex) {
    path.push({ letter: "C", octave: 4 });
  } else {
    const step = tgtIndex > refIndex ? 1 : -1;
    for (let i = refIndex; ; i += step) {
      path.push(indexToNote(i));
      if (i === tgtIndex) break;
    }
  }
  return path.map((n) => ({ ...n, solfege: SOLFEGE[n.letter] }));
}

const PRAISE = ["やったね！", "せいかい！", "さすが〜！", "ぴったり！", "かんぺき！", "その調子！"];
const GENTLE = ["おしい！もういっかい！", "だいじょうぶ、がんばれ！", "ちかいよ、もう一回！"];

/* =========================================================
   五線譜 SVG コンポーネント
   ========================================================= */
function StaffView({ clef, pos, mood }) {
  const baseY = 172;
  const spacing = 9;
  const yFor = (p) => baseY - p * spacing;
  const lineYs = [0, 2, 4, 6, 8].map(yFor);
  const noteX = 195;
  const noteY = yFor(pos);

  const ledgers = [];
  if (pos >= 10) {
    for (let l = 10; l <= pos; l += 2) ledgers.push(l);
  } else if (pos <= -2) {
    for (let l = -2; l >= pos; l -= 2) ledgers.push(l);
  }
  const stemUp = pos < 4;
  const noteColor = mood === "correct" ? "#5FB88A" : mood === "wrong" ? "#E8688A" : "#5A4A85";

  return (
    <svg viewBox="0 0 300 260" className="w-full max-w-xs mx-auto" style={{ display: "block" }}>
      {lineYs.map((y, i) => (
        <line key={i} x1={55} y1={y} x2={265} y2={y} stroke="#B7A8D6" strokeWidth={2.5} strokeLinecap="round" />
      ))}
      <text
        x={92}
        y={clef === "treble" ? 152 : 130}
        fontSize={clef === "treble" ? 118 : 66}
        textAnchor="middle"
        dominantBaseline="middle"
        fill="#6B4E9B"
      >
        {CLEF_INFO[clef].symbol}
      </text>
      {ledgers.map((l) => (
        <line key={l} x1={noteX - 17} y1={yFor(l)} x2={noteX + 17} y2={yFor(l)} stroke="#B7A8D6" strokeWidth={2.5} strokeLinecap="round" />
      ))}
      {stemUp ? (
        <line x1={noteX + 8.7} y1={noteY - 1} x2={noteX + 8.7} y2={noteY - 40} stroke={noteColor} strokeWidth={2.4} strokeLinecap="round" />
      ) : (
        <line x1={noteX - 8.7} y1={noteY + 1} x2={noteX - 8.7} y2={noteY + 40} stroke={noteColor} strokeWidth={2.4} strokeLinecap="round" />
      )}
      <ellipse cx={noteX} cy={noteY} rx={10.5} ry={7.8} fill={noteColor} transform={`rotate(-18 ${noteX} ${noteY})`} />
    </svg>
  );
}

const DECOR = [
  { e: "⭐️", top: "6%", left: "6%", delay: "0s", size: 22 },
  { e: "🎵", top: "12%", left: "88%", delay: "1.1s", size: 26 },
  { e: "✨", top: "38%", left: "3%", delay: "2s", size: 18 },
  { e: "🎶", top: "68%", left: "92%", delay: "0.5s", size: 24 },
  { e: "⭐️", top: "86%", left: "10%", delay: "1.6s", size: 16 },
  { e: "✨", top: "50%", left: "95%", delay: "2.4s", size: 16 },
  { e: "🎵", top: "80%", left: "80%", delay: "0.9s", size: 18 },
];

function BackgroundDecor() {
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
      {DECOR.map((d, i) => (
        <span
          key={i}
          style={{
            position: "absolute",
            top: d.top,
            left: d.left,
            fontSize: d.size,
            animation: `floaty 5.5s ease-in-out ${d.delay} infinite`,
            opacity: 0.75,
          }}
        >
          {d.e}
        </span>
      ))}
    </div>
  );
}

function BurstFX() {
  const items = useMemo(
    () =>
      Array.from({ length: 10 }).map((_, i) => ({
        left: 10 + Math.random() * 80,
        emoji: ["✨", "⭐️", "🎉", "💫"][i % 4],
        delay: Math.random() * 0.15,
        size: 14 + Math.random() * 14,
      })),
    []
  );
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none rounded-3xl" aria-hidden="true">
      {items.map((it, i) => (
        <span
          key={i}
          style={{
            position: "absolute",
            left: `${it.left}%`,
            bottom: "40%",
            fontSize: it.size,
            animation: `popUp 0.85s ease-out ${it.delay}s forwards`,
          }}
        >
          {it.emoji}
        </span>
      ))}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [mode, setMode] = useState("instant");
  const [clefFilter, setClefFilter] = useState("both");

  const [note, setNote] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [locked, setLocked] = useState(false);
  const [mascotMsg, setMascotMsg] = useState("この音符、なにかな？");
  const [burst, setBurst] = useState(false);

  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);

  const [timeLeft, setTimeLeft] = useState(5);
  const [hintActive, setHintActive] = useState(false);
  const [hintSteps, setHintSteps] = useState([]);
  const [hintIndex, setHintIndex] = useState(-1);
  const [practiceStars, setPracticeStars] = useState(0);

  const timerRef = useRef(null);
  const hintTimeoutsRef = useRef([]);
  const synthRef = useRef(null);

  const clearAllTimers = useCallback(() => {
    clearInterval(timerRef.current);
    hintTimeoutsRef.current.forEach(clearTimeout);
    hintTimeoutsRef.current = [];
  }, []);

  useEffect(() => () => clearAllTimers(), [clearAllTimers]);

  const ensureAudio = useCallback(async () => {
    if (!synthRef.current) {
      synthRef.current = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 0.18, sustain: 0.15, release: 0.35 },
      }).toDestination();
    }
    if (Tone.context.state !== "running") {
      try { await Tone.start(); } catch (e) {}
    }
  }, []);

  const playNote = useCallback((letter, octave, dur = "8n") => {
    ensureAudio().then(() => {
      synthRef.current.triggerAttackRelease(`${letter}${octave}`, dur);
    });
  }, [ensureAudio]);

  const playChime = useCallback(() => {
    ensureAudio().then(() => {
      const s = synthRef.current;
      const now = Tone.now();
      s.triggerAttackRelease("C5", "16n", now);
      s.triggerAttackRelease("E5", "16n", now + 0.11);
      s.triggerAttackRelease("G5", "16n", now + 0.22);
      s.triggerAttackRelease("C6", "8n", now + 0.33);
    });
  }, [ensureAudio]);

  const nextNote = useCallback(() => {
    clearAllTimers();
    setHintActive(false);
    setHintSteps([]);
    setHintIndex(-1);
    setFeedback(null);
    setLocked(false);
    setMascotMsg("この音符、なにかな？");
    setNote((prev) => randomNote(clefFilter, prev));
  }, [clefFilter, clearAllTimers]);

  const startGame = (selectedMode) => {
    ensureAudio();
    setMode(selectedMode);
    setScore(0);
    setStreak(0);
    setBestStreak(0);
    setPracticeStars(0);
    setScreen("game");
    clearAllTimers();
    setHintActive(false);
    setFeedback(null);
    setLocked(false);
    setMascotMsg("この音符、なにかな？");
    setNote(randomNote(clefFilter, null));
  };

  const backHome = () => {
    clearAllTimers();
    setScreen("home");
  };

  const triggerHint = useCallback(() => {
    if (!note) return;
    clearAllTimers();
    setLocked(true);
    setHintActive(true);
    const path = hintPath(note);
    setHintSteps(path);
    setHintIndex(-1);
    setMascotMsg("いっしょに かぞえよう！");
    path.forEach((n, i) => {
      const t = setTimeout(() => {
        setHintIndex(i);
        playNote(n.letter, n.octave, "8n");
        if (i === path.length - 1) {
          setTimeout(() => {
            setMascotMsg(`こたえは「${note.solfege}」だよ！`);
          }, 550);
        }
      }, i * 620);
      hintTimeoutsRef.current.push(t);
    });
  }, [note, clearAllTimers, playNote]);

  useEffect(() => {
    if (mode !== "practice" || screen !== "game" || !note || locked || hintActive) return;
    setTimeLeft(5);
    const start = Date.now();
    timerRef.current = setInterval(() => {
      const remain = Math.max(0, 5 - (Date.now() - start) / 1000);
      setTimeLeft(remain);
      if (remain <= 0) {
        clearInterval(timerRef.current);
        triggerHint();
      }
    }, 100);
    return () => clearInterval(timerRef.current);
    // eslint-disable-next-line
  }, [note, mode, screen]);

  const handleAnswer = (sol) => {
    if (!note || locked || hintActive) return;
    const correct = sol === note.solfege;

    if (mode === "instant") {
      setLocked(true);
      clearAllTimers();
      if (correct) {
        setScore((s) => s + 1);
        setStreak((s) => {
          const ns = s + 1;
          setBestStreak((b) => Math.max(b, ns));
          return ns;
        });
        setFeedback("correct");
        setMascotMsg(PRAISE[randInt(0, PRAISE.length - 1)]);
        playChime();
        setBurst(true);
        setTimeout(() => { setBurst(false); nextNote(); }, 850);
      } else {
        setStreak(0);
        setFeedback("wrong");
        setMascotMsg(`おしい！せいかいは「${note.solfege}」だったよ`);
        playNote(note.letter, note.octave, "4n");
        setTimeout(() => nextNote(), 1300);
      }
    } else {
      if (correct) {
        setLocked(true);
        clearAllTimers();
        setPracticeStars((s) => s + 1);
        setFeedback("correct");
        setMascotMsg(PRAISE[randInt(0, PRAISE.length - 1)]);
        playChime();
        setBurst(true);
        setTimeout(() => { setBurst(false); nextNote(); }, 850);
      } else {
        setFeedback("wrong");
        setMascotMsg(GENTLE[randInt(0, GENTLE.length - 1)]);
        setTimeout(() => setFeedback(null), 400);
      }
    }
  };

  const listenCurrent = () => {
    if (!note) return;
    playNote(note.letter, note.octave, "4n");
  };

  const isHintDone = hintActive && hintIndex === hintSteps.length - 1;
  const timerPct = Math.max(0, Math.min(100, (timeLeft / 5) * 100));
  const timerColor = timeLeft > 2.5 ? "#5FB88A" : timeLeft > 1 ? "#F0B84C" : "#E8688A";
  const fontStack = "'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif";

  if (screen === "home") {
    return (
      <div
        className="min-h-screen w-full relative flex items-center justify-center p-4"
        style={{ fontFamily: fontStack, background: "linear-gradient(160deg, #EAE0FB 0%, #D8ECFA 45%, #FDE4EF 100%)" }}
      >
        <BackgroundDecor />
        <div className="relative z-10 w-full max-w-md">
          <div className="rounded-3xl p-6 shadow-xl" style={{ background: "rgba(255,255,255,0.85)", border: "3px solid #FFFFFF", boxShadow: "0 12px 30px rgba(107,78,155,0.18)" }}>
            <div className="text-center mb-4">
              <div style={{ fontSize: 44, lineHeight: 1 }}>🐰🎼</div>
              <h1 className="mt-2" style={{ fontSize: 26, fontWeight: 800, color: "#6B4E9B", letterSpacing: 1 }}>きらきら♪おんぷクエスト</h1>
              <p className="mt-1" style={{ fontSize: 13, color: "#8B7BAF", fontWeight: 700 }}>うさぎのメロと あそぼう！3年生の 譜読みたんけん</p>
            </div>
            <div className="flex items-center gap-2 mb-5 justify-center">
              <div className="rounded-2xl px-4 py-2 text-center" style={{ background: "#FFF3D6", border: "2px solid #FFE49C", fontSize: 13, color: "#7A5C1E", fontWeight: 700 }}>
                モードと 音記号を えらんでね！
              </div>
            </div>
            <div className="mb-5">
              <p className="mb-2 text-center" style={{ fontSize: 12, color: "#6B4E9B", fontWeight: 800 }}>れんしゅうする 音記号</p>
              <div className="flex gap-2 justify-center flex-wrap">
                {[
                  { key: "treble", label: "ト音記号 𝄞" },
                  { key: "bass", label: "ヘ音記号 𝄢" },
                  { key: "both", label: "りょうほう" },
                ].map((c) => (
                  <button
                    key={c.key}
                    onClick={() => setClefFilter(c.key)}
                    className="rounded-full px-4 py-2 transition"
                    style={{
                      fontSize: 13, fontWeight: 800, fontFamily: fontStack,
                      background: clefFilter === c.key ? "#6B4E9B" : "#F1E9FB",
                      color: clefFilter === c.key ? "#FFFFFF" : "#6B4E9B",
                      border: "2px solid #6B4E9B",
                    }}
                  >
                    {c.label}
                  </button>
                ))}
              </div>
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={() => startGame("instant")} className="rounded-2xl p-4 text-left transition active:scale-95"
                style={{ background: "linear-gradient(135deg, #FFC1D9, #FFE0EC)", border: "3px solid #FFFFFF", boxShadow: "0 6px 16px rgba(255,131,175,0.35)" }}>
                <div className="flex items-center gap-3">
                  <div style={{ fontSize: 30 }}>⚡️</div>
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 17, color: "#8B2D53" }}>即答チャレンジ</div>
                    <div style={{ fontSize: 12, color: "#A5416B", fontWeight: 700 }}>直感でパッとタップ！スピード勝負</div>
                  </div>
                </div>
              </button>
              <button onClick={() => startGame("practice")} className="rounded-2xl p-4 text-left transition active:scale-95"
                style={{ background: "linear-gradient(135deg, #BFEAF0, #E1F6F9)", border: "3px solid #FFFFFF", boxShadow: "0 6px 16px rgba(95,184,202,0.35)" }}>
                <div className="flex items-center gap-3">
                  <div style={{ fontSize: 30 }}>⏳</div>
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 17, color: "#1F6B78" }}>練習レッスン</div>
                    <div style={{ fontSize: 12, color: "#2C8595", fontWeight: 700 }}>5びょうで こたえよう。まよったら ヒント！</div>
                  </div>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full relative flex items-start justify-center p-3"
      style={{ fontFamily: fontStack, background: "linear-gradient(160deg, #EAE0FB 0%, #D8ECFA 45%, #FDE4EF 100%)" }}>
      <BackgroundDecor />
      <div className="relative z-10 w-full max-w-md">
        <div className="flex items-center justify-between mb-3 mt-1">
          <button onClick={backHome} className="rounded-full p-2 flex items-center justify-center"
            style={{ background: "rgba(255,255,255,0.85)", border: "2px solid #FFFFFF", width: 34, height: 34 }} aria-label="ホームへもどる">
            <span style={{ color: "#6B4E9B", fontSize: 16, fontWeight: 800 }}>←</span>
          </button>
          <div className="rounded-full px-3 py-1 flex items-center gap-1"
            style={{ background: "rgba(255,255,255,0.85)", fontSize: 12, fontWeight: 800, color: "#6B4E9B", border: "2px solid #FFFFFF" }}>
            {mode === "instant" ? "⚡️即答チャレンジ" : "⏳練習レッスン"} ・ {clefFilter === "both" ? "りょうほう" : CLEF_INFO[clefFilter].label}
          </div>
          {mode === "instant" ? (
            <div className="rounded-full px-3 py-1 flex items-center gap-1" style={{ background: "rgba(255,255,255,0.85)", border: "2px solid #FFFFFF" }}>
              <span style={{ fontSize: 13 }}>🔥</span>
              <span style={{ fontSize: 12, fontWeight: 800, color: "#E8688A" }}>{streak}</span>
            </div>
          ) : (
            <div className="rounded-full px-3 py-1 flex items-center gap-1" style={{ background: "rgba(255,255,255,0.85)", border: "2px solid #FFFFFF" }}>
              <span style={{ fontSize: 13 }}>⭐</span>
              <span style={{ fontSize: 12, fontWeight: 800, color: "#B8842A" }}>{practiceStars}</span>
            </div>
          )}
        </div>

        {mode === "instant" && (
          <div className="flex items-center justify-center gap-4 mb-2" style={{ fontSize: 12, fontWeight: 800, color: "#6B4E9B" }}>
            <span className="flex items-center gap-1">🏆 スコア {score}</span>
            <span>さいこう連続 {bestStreak}</span>
          </div>
        )}

        <div className="rounded-3xl p-4 mb-3 relative"
          style={{ background: "rgba(255,255,255,0.9)", border: "3px solid #FFFFFF", boxShadow: "0 12px 30px rgba(107,78,155,0.18)" }}>
          {burst && <BurstFX />}
          {note && <StaffView clef={note.clef} pos={note.pos} mood={feedback} />}
          <div className="flex items-center justify-center gap-2 mt-1">
            <button onClick={listenCurrent} className="rounded-full px-3 py-1 flex items-center gap-1 transition active:scale-95"
              style={{ background: "#F1E9FB", border: "2px solid #D8C7F2" }}>
              <span style={{ fontSize: 13 }}>🔊</span>
              <span style={{ fontSize: 11, fontWeight: 800, color: "#6B4E9B" }}>音を聴く</span>
            </button>
            {mode === "practice" && !hintActive && (
              <button onClick={triggerHint} className="rounded-full px-3 py-1 flex items-center gap-1 transition active:scale-95"
                style={{ background: "#FFF3D6", border: "2px solid #FFE49C" }}>
                <span style={{ fontSize: 13 }}>💡</span>
                <span style={{ fontSize: 11, fontWeight: 800, color: "#B8842A" }}>ヒント</span>
              </button>
            )}
          </div>
        </div>

        {mode === "practice" && !hintActive && (
          <div className="mb-3 px-1">
            <div className="w-full rounded-full overflow-hidden" style={{ height: 10, background: "#F1E9FB", border: "2px solid #FFFFFF" }}>
              <div style={{ height: "100%", width: `${timerPct}%`, background: timerColor, transition: "width 0.1s linear, background 0.3s", borderRadius: 9999 }} />
            </div>
          </div>
        )}

        <div className="flex items-center gap-2 mb-3 justify-center">
          <div style={{ fontSize: 34, animation: feedback === "correct" ? "bouncy 0.6s ease" : feedback === "wrong" ? "shaky 0.4s ease" : "none" }}>🐰</div>
          <div className="rounded-2xl px-4 py-2"
            style={{
              background: feedback === "correct" ? "#E7F7EE" : feedback === "wrong" ? "#FDEAEF" : "#FFF3D6",
              border: `2px solid ${feedback === "correct" ? "#B7E4CB" : feedback === "wrong" ? "#F5C2D2" : "#FFE49C"}`,
              fontSize: 13, fontWeight: 800,
              color: feedback === "correct" ? "#2C7A50" : feedback === "wrong" ? "#B23A5C" : "#7A5C1E",
              maxWidth: 260, textAlign: "center",
            }}>
            {mascotMsg}
          </div>
        </div>

        {hintActive && (
          <div className="rounded-2xl p-3 mb-3" style={{ background: "rgba(255,255,255,0.9)", border: "3px solid #FFE49C" }}>
            <p className="text-center mb-2" style={{ fontSize: 11, fontWeight: 800, color: "#B8842A" }}>まんなかの「ド」から じゅんばんに かぞえよう</p>
            <div className="flex items-center justify-center gap-1.5 flex-wrap">
              {hintSteps.map((s, i) => (
                <div key={i} className="rounded-xl flex items-center justify-center transition"
                  style={{
                    width: 40, height: 40, fontSize: 15, fontWeight: 800,
                    background: i <= hintIndex ? "#6B4E9B" : "#F1E9FB",
                    color: i <= hintIndex ? "#FFFFFF" : "#B7A8D6",
                    transform: i === hintIndex ? "scale(1.15)" : "scale(1)",
                    transition: "all 0.25s ease",
                  }}>
                  {s.solfege}
                </div>
              ))}
            </div>
            {isHintDone && (
              <div className="flex justify-center mt-3">
                <button onClick={nextNote} className="rounded-full px-6 py-2 transition active:scale-95"
                  style={{ background: "#6B4E9B", color: "#FFFFFF", fontWeight: 800, fontSize: 14 }}>
                  つぎへ ▶
                </button>
              </div>
            )}
          </div>
        )}

        {!hintActive && (
          <div className="flex flex-wrap gap-2 justify-center pb-6">
            {SOLFEGE_ORDER.map((sol) => {
              const isCorrectBtn = feedback && note && sol === note.solfege;
              return (
                <button key={sol} onClick={() => handleAnswer(sol)} disabled={locked} className="rounded-2xl transition active:scale-90"
                  style={{
                    width: 78, height: 62, fontSize: 20, fontWeight: 800, fontFamily: fontStack, color: "#FFFFFF",
                    background: isCorrectBtn ? "#5FB88A" : (feedback === "wrong" && !isCorrectBtn) ? "#D8C7F2" : "linear-gradient(135deg, #A78BDB, #8B6FC7)",
                    opacity: locked && !isCorrectBtn ? 0.6 : 1,
                    border: "3px solid #FFFFFF", boxShadow: "0 5px 12px rgba(107,78,155,0.3)",
                  }}>
                  {sol}
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
